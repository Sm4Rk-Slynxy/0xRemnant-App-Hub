<!doctype html><html lang="en"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Little Notes</title>
<style>*{box-sizing:border-box}body{margin:0;background:#f3f0e8;color:#273d32;font:16px/1.7 system-ui,sans-serif;padding:45px 24px}main{max-width:680px;margin:auto}small{font-size:10px;letter-spacing:2px}h1{font-size:48px;font-weight:600;letter-spacing:-2px;margin:15px 0 5px}p{color:#697b6a}textarea{display:block;width:100%;height:280px;resize:vertical;border:1px solid #ccd5c6;border-radius:15px;background:#fffdf5;padding:22px;font:17px/1.8 Georgia,serif;color:#344a37;outline-color:#6f9478;box-shadow:0 15px 35px #4155360c}footer{font-size:11px;color:#7b8f7c;margin-top:18px;display:flex;justify-content:space-between}button{border:1px solid #b9cab9;background:none;border-radius:7px;padding:7px 11px;color:#344a37;cursor:pointer}</style>
<main><small>YOUR FIRST APP HUB APP</small><h1>A little space to think.</h1><p>Write something down. Your notes save automatically in this browser.</p><textarea id="note" aria-label="Your notes" placeholder="An idea worth keeping…"></textarea><footer><span id="status">Saved locally in your browser.</span><button id="clear">Clear notes</button></footer></main>
<script>const note=document.getElementById('note'),status=document.getElementById('status');try{note.value=localStorage.getItem('little-notes')||'';}catch{status.textContent='Browser storage is unavailable.';}note.addEventListener('input',()=>{try{localStorage.setItem('little-notes',note.value);status.textContent='Saved just now.';}catch{status.textContent='Unable to save in this browser.';}});document.getElementById('clear').onclick=()=>{if(confirm('Clear your notes?')){note.value='';note.dispatchEvent(new Event('input'));}};</script></html>
